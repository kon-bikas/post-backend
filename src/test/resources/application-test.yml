spring:
    application:
        name: postr
    datasource:
        url: jdbc:h2:mem:test
        username: admin
        password: admin
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect

        defer-datasource-initialization: true
    sql:
        init:
            mode: always

    servlet:
        multipart:
            enabled: true
            max-file-size: 20MB