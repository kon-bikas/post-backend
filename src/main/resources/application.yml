spring:
    application:
        name: postr
    profiles:
        active: prod
    datasource:
      url: jdbc:postgresql://localhost:5432/oauth_test
      username: admin
      password: admin
    jpa:
        hibernate:
          ddl-auto: create-drop
        show-sql: true
        properties:
          hibernate:
              dialect: org.hibernate.dialect.PostgreSQLDialect
    servlet:
      multipart:
          enabled: true
          max-file-size: 20MB
#          max-request-size: 60MB
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:9090/realms/demo-realm
                    jwk-set-uri: http://localhost:9090/realms/demo-realm/protocol/openid-connect/certs
    rabbitmq:
        host: localhost
        port: 5672
        username: app
        password: app
        virtual-host: service

server:
    servlet:
        context-path: /api

springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html

app:
    storage:
        accessKey: minioadmin
        secretKey: minioadmin
        bucket: media
        host_ip: localhost
        host_port: 9000
    keycloak:
        server_url: http://localhost:9090
        realm: demo-realm
        client_id: demo-client
        client_secret: bZALoPEH0PEvZTLQis0ppfmWcZIrGvIX
    rabbitmq:
        queue: app.queue
    pageable:
        page-size: 10
