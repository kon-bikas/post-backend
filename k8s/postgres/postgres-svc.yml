apiVersion: v1
kind: Service
metadata:
    name: psql-svc
    namespace: default
    labels:
        app: db
        db: psql
spec:
    selector:
        app: psql
    type: ClusterIP
    clusterIP: None
    ports:
        - name: postgres-svc-port
          protocol: TCP
          port: 5432
          targetPort: psql-port


