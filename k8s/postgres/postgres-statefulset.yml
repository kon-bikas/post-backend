apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: psql-statefulset
    namespace: default
    labels:
        app: db
        db: psql
spec:
    replicas: 2
    serviceName: psql-svc
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            initContainers:
                - name: psql-init
                  image: postgres:16
                  volumeMounts:
                      - name: psql-conf
                        mountPath: /tmp/psql/conf
                      - name: psql-volume
                        mountPath: /var/lib/postgresql/data
                  command:
                      - "/bin/bash"
                      - "-c"
                      - |
                          hn="$(hostname)"
                          if [[ ${hn: -1} -eq 0 ]]; then
                            echo "configuring master node..."
                            cat /tmp/psql/conf/master-conf >> /var/lib/postgresql/data/postgresql.conf
                            echo "created the
                          else
                            echo "configuring slave node..."
                            cat /tmp/psql/conf/slave-conf >> /var/lib/postgresql/data/postgresql.conf
                          fi
            containers:
                - name: psql-container
                  image: postgres:16
                  envFrom:
                      - configMapRef:
                            name: psql-cm
                  volumeMounts:
                      - name: psql-volume
                        mountPath: /var/lib/postgresql/data
                  ports:
                      - name: psql-port
                        containerPort: 5432
            volumes:
                - name: psql-conf
                  configMap:
                      name: psql-conf-cm
                      items:
                          - key: psql.conf.master
                            path: master-conf
                          - key: psql.conf.slave
                            path: slave-conf
    volumeClaimTemplates:
        - metadata:
            name: psql-volume
          spec:
              accessModes: [ "ReadWriteOnce" ]
              storageClassName: "microk8s-hostpath"
              resources:
                  requests:
                      storage: 300Mi




