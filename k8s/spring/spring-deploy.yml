apiVersion: apps/v1
kind: Deployment
metadata:
    name: spring-deployment
    namespace: default
    labels:
        app: postr-app
        component: app-server
spec:
    replicas: 1
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 2
            maxUnavailable: 1
    selector:
        matchLabels:
            app: postr-app
    template:
        metadata:
            labels:
                app: postr-app
        spec:
            containers:
                - name: postr-container
                  image: ghcr.io/kon-bikas/post-app:latest
                  ports:
                      - containerPort: 8080
                        name: postr-port
                  envFrom:
                      - configMapRef:
                            name: spring-cm
                  readinessProbe:
                      httpGet:
                          path: /api/actuator/health/readiness
                          port: postr-port
                      initialDelaySeconds: 20
                      periodSeconds: 20
                      timeoutSeconds: 15
                  livenessProbe:
                      httpGet:
                          path: /api/actuator/health/liveness
                          port: postr-port
                      initialDelaySeconds: 20
                      periodSeconds: 20
                      timeoutSeconds: 15
                  resources:
                      requests:
                          cpu: 300m
                          memory: 256Mi
                      limits:
                          cpu: 1000m
                          memory: 512Mi
                  imagePullPolicy: Always
            imagePullSecrets:
                - name: ghcr-secret