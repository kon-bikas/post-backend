apiVersion: v1
kind: Service
metadata:
    name: rabbit-np-svc
    namespace: default
    labels:
        app: rabbitmq
spec:
    selector:
        app: rabbitmq
    type: NodePort
    ports:
        - name: rabbit-np-port
          protocol: TCP
          port: 15672
          nodePort: 30113
          targetPort: admin-port